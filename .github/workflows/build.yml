name: Build

on:
  push:
    branches:
      - production
      - homologation
      - development
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test and check module rules
        run: ./gradlew build

      - name: Upload server plugins
        uses: actions/upload-artifact@v4
        with:
          name: servers
          path: build/servers
          if-no-files-found: error
