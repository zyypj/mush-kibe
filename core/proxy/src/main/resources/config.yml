server:
  id: proxy-1
  group: proxy
  kind: PROXY

routing:
  auth-group: auth
  lobby-group: lobby

authentication:
  premium-auto-login: true
  premium-lookup-timeout: 3s
  premium-cache: 6h
  cracked-cache: 10m
  session-duration: 24h

database:
  url: jdbc:postgresql://localhost:5432/muxe
  username: muxe
  password: env:MUXE_DATABASE_PASSWORD
  pool-size: 4
  connection-timeout: 5s
  run-migrations: true

redis:
  host: localhost
  port: 6379
  username: ""
  password: env:MUXE_REDIS_PASSWORD
  database: 0
  ssl: false
  pool-size: 8
  timeout: 2s

messaging:
  secret: env:MUXE_MESSAGING_SECRET
  request-timeout: 3s

metrics:
  enabled: true
  host: 127.0.0.1
  port: 9410

editor:
  enabled: true
  bind: 0.0.0.0
  port: 1031
  public-url: "http://151.244.40.191:1031"
  requests-per-minute: 240
  failed-logins-per-ten-minutes: 20
  max-body-bytes: 1048576

motd:
  max-players: 3000
  lines:
    - "&c&m  &6&m  &e&m  &a&m  &b&m  &r &b&lMUXE&r &b&m  &a&m  &e&m  &6&m  &c&m  "
    - "&a&lVENHA JOGAR"

geoip:
  enabled: true
  account-id: ""
  license-key: ""
  refresh-after: 7d

messages:
  no-auth-server:
    - "&cNão foi possível te conectar ao servidor."
    - "&cMotivo: Servidores de Autenticação Desligados"
    - "&cTente novamente em alguns minutos."
    - ""
    - "&eAcompanhe as notícias em: &bmuxe.com.br"
    - "&cO problema continua? Avise a equipe em &bdiscord.muxe.com.br"
  server-restarting:
    - "&cVocê foi desconectado do servidor."
    - "&cMotivo: Servidor reiniciando"
    - "&cTente entrar novamente em alguns minutos."
    - ""
    - "&eMais informações no nosso Discord: &bdiscord.muxe.com.br"
  server-moved: "&eO servidor em que você estava está reiniciando. Você foi levado para outro servidor."
  no-lobby-server: "&cNenhum lobby disponível no momento. Use /lobby em instantes."
  no-server: "&cNenhum servidor disponível para &f{destination}&c."
  must-authenticate: "&cFaça login antes de trocar de servidor."
  name-case-conflict: "&cO nome &f{username} &cjá está registrado com outras letras maiúsculas/minúsculas. Entre com o nome exato."
  invalid-username: "&cO nome &f{username} &cnão é permitido."
  service-unavailable: "&cNossos serviços estão indisponíveis. Tente novamente em instantes."
