server:
  id: proxy-1
  group: proxy
  kind: PROXY

routing:
  auth-group: auth
  lobby-group: lobby

authentication:
  premium-auto-login: true
  premium-lookup-timeout: 3s
  premium-cache: 6h
  cracked-cache: 10m
  session-duration: 2h

database:
  url: jdbc:postgresql://localhost:5432/muxe
  username: muxe
  password: env:MUXE_DATABASE_PASSWORD
  pool-size: 4
  connection-timeout: 5s
  run-migrations: true

redis:
  host: localhost
  port: 6379
  username: ""
  password: env:MUXE_REDIS_PASSWORD
  database: 0
  ssl: false
  pool-size: 8
  timeout: 2s

messaging:
  secret: env:MUXE_MESSAGING_SECRET
  request-timeout: 3s

metrics:
  enabled: true
  host: 127.0.0.1
  port: 9410

messages:
  no-auth-server:
    - "&cA rede está temporariamente fechada."
    - "&cMotivo: Servidores de autenticação desligados"
    - "&cTente novamente em alguns minutos."
    - ""
    - "&eAcompanhe as novidades em: &bmuxe.com.br"
    - "&cO problema continua? Avise a equipe em &bmuxe.com.br"
  no-lobby-server: "&cNenhum lobby disponível no momento. Use /lobby em instantes."
  no-server: "&cNenhum servidor disponível para &f{destination}&c."
  must-authenticate: "&cFaça login antes de trocar de servidor."
  name-case-conflict: "&cO nome &f{username} &cjá está registrado com outras letras maiúsculas/minúsculas. Entre com o nome exato."
  invalid-username: "&cO nome &f{username} &cnão é permitido."
  service-unavailable: "&cNossos serviços estão indisponíveis. Tente novamente em instantes."
