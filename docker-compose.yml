name: muxe

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: muxe
      POSTGRES_USER: muxe
      POSTGRES_PASSWORD: ${MUXE_DATABASE_PASSWORD:?set MUXE_DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U muxe -d muxe
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --requirepass
      - ${MUXE_REDIS_PASSWORD:?set MUXE_REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${MUXE_REDIS_PASSWORD}

volumes:
  postgres-data:
