[versions]
java = "25"
spigot = "1.8.8-R0.1-SNAPSHOT"
velocity = "4.3.0"
netty = "4.0.23.Final"
shadow = "9.6.1"
hikari = "7.1.0"
postgresql = "42.7.14"
flyway = "13.11.1"
jedis = "8.0.2"
junit = "6.1.3"
assertj = "3.27.7"
testcontainers = "2.0.5"

[libraries]
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
netty = { module = "io.netty:netty-all", version.ref = "netty" }

hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-core = { module = "org.testcontainers:testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

shadow-gradle-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }

[bundles]
postgresql = ["hikari", "postgresql", "flyway-core", "flyway-postgresql"]
testcontainers = ["testcontainers-core", "testcontainers-junit", "testcontainers-postgresql"]
