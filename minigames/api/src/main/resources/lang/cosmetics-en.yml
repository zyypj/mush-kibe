        void-final-death: "{victim} &7fell into the void&7. &b&lFINAL KILL!"
        bed: "{team-color}{team} Bed &7was destroyed {br}by {player}&7."
    estatistico:
      messages:
        kill: "{victim} &7was {killer}&7's &b#{count}&7 kill."
        final-kill: "{victim} &7was {killer}&7's &b#{count}&7 {br}final kill."
        death: "{victim} &7has now died &b{count}&7 times."
        final-death: "{victim} &7suffered their &b#{count}&7 final death."
        bed: "{team-color}{team} Bed &7was the &b#{count}&7 {br}bed destroyed by {player}&7."
