  sets:
    padrao:
      messages:
        kill: "{victim} &7was killed by {killer}&7."
        final-kill: "{victim} &7was killed by {killer}&7. &b&lFINAL KILL!"
        void-kill: "{victim} &7was knocked into the void by {killer}&7."
        void-final-kill: "{victim} &7was knocked into the void by {killer}&7. &b&lFINAL KILL!"
        death: "{victim} &7died&7."
        final-death: "{victim} &7died&7. &b&lFINAL KILL!"
