modes:
  solo:
    display-name: Solo
    min-players: 6
    max-players: 8
    team-size: 1
  duplas:
    display-name: Duplas
    min-players: 8
    max-players: 16
    team-size: 2
  trios:
    display-name: Trios
    min-players: 6
    max-players: 12
    team-size: 3
    fixed-teams:
      - azul
      - vermelho
      - verde
      - amarelo
  quartetos:
    display-name: Quartetos
    min-players: 8
    max-players: 16
    team-size: 4
    fixed-teams:
      - azul
      - vermelho
      - verde
      - amarelo
  1v1:
    display-name: 1v1
    min-players: 2
    max-players: 2
    team-size: 1
    fixed-teams:
      - azul
      - vermelho
  2v2:
    display-name: 2v2
    min-players: 4
    max-players: 4
    team-size: 2
    fixed-teams:
      - azul
      - vermelho
  3v3:
    display-name: 3v3
    min-players: 6
    max-players: 6
    team-size: 3
    fixed-teams:
      - azul
      - vermelho
  4v4:
    display-name: 4v4
    min-players: 8
    max-players: 8
    team-size: 4
    fixed-teams:
      - azul
      - vermelho
  4s:
    display-name: 4s
    min-players: 8
    max-players: 8
    team-size: 4
    extra-islands: true
    fixed-teams:
      - azul
      - vermelho

lobby-group: lobby
default-mode: solo

timings:
  respawn-seconds: 5
  rejoin-seconds: 180
  restart-seconds: 30
  respawn-protection-seconds: 4
  island-radius: 17
  spawn-protection-radius: 5
  npc-protection-radius: 1
  generator-protection-radius: 1

countdown:
  titles:
    '30': "&a30 segundos"
    '10': "&610 segundos"
    '5': "&c5"
    '4': "&c4"
    '3': "&c3"
    '2': "&c2"
    '1': "&c1"

forges:
  stack-items: false
  split-radius: 2
  island:
    iron:
      delay: 0.9
      amount-per-player: 1
      max-amount: 4
      spawn-limit: 48
    gold:
      delay: 7.0
      amount: 1
      spawn-limit: 14
    emerald:
      delay: 10.0
      amount: 1
      spawn-limit: 10
  diamond:
    tierI:
      delay: 30.0
      amount: 1
      spawn-limit: 4
    tierII:
      delay: 20.0
      amount: 1
      spawn-limit: 4
      start: 360
    tierIII:
      delay: 15.0
      amount: 1
      spawn-limit: 6
      start: 1080
  emerald:
    tierI:
      delay: 60.0
      amount: 1
      spawn-limit: 4
    tierII:
      delay: 40.0
      amount: 1
      spawn-limit: 4
      start: 720
    tierIII:
      delay: 24.0
      amount: 1
      spawn-limit: 6
      start: 1440

