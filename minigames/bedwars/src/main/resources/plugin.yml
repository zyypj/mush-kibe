name: Muxe-BedWars
version: '${version}'
main: br.com.muxe.minigame.bedwars.BedWarsPlugin
author: Muxe
description: BedWars for the Muxe network.
depend:
  - Muxe-Core
permissions:
  muxe.bedwars.admin:
    description: Allows /bedwars iniciar to start a match without the minimum players.
    default: op
  muxe.minigame.setup:
    description: Allows /arena to create and set up arenas.
    default: op
  muxe.cosmetics.admin:
    description: Allows /cosmeticos dar to grant BedWars cosmetics.
    default: op
  muxe.cosmetic.ultra:
    description: Unlocks the BedWars cosmetics included in ULTRA.
    default: false
