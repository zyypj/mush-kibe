security:
  pbkdf2-iterations: 600000
  login-timeout: 60s
  max-attempts: 5
  attempt-window: 5m

password:
  min-length: 6
  max-length: 64

challenge:
  enabled: true
  length: 4
  max-attempts: 3
  distance: 4

reminder:
  interval: 5s

protection:
  void-level: 0

