name: Muxe-Auth
version: '${version}'
main: br.com.muxe.auth.MuxeAuthPlugin
author: Muxe
description: Authentication server of the Muxe network.
depend:
  - Muxe-Core
commands:
  login:
    description: Logs into your account.
    usage: /login <password>
    aliases:
      - logar
  register:
    description: Creates your account.
    usage: /register <password> <password>
    aliases:
      - registrar
  authsetup:
    description: Configures the spawn and the challenge code position.
    usage: /authsetup <spawn|codigo|testar|info|limpar <spawn|codigo>>
permissions:
  muxe.auth.setup:
    description: Allows /authsetup and moving freely on the auth server after logging in.
    default: op
