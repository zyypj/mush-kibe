name: Muxe-Lobby
version: '${version}'
main: br.com.muxe.lobby.MuxeLobbyPlugin
author: Muxe
description: Main lobby of the Muxe network.
depend:
  - Muxe-Core
commands:
  jogar:
    description: Sends you to a game.
    usage: /jogar <game>
    aliases:
      - play
  setspawn:
    description: Sets the lobby spawn at your position.
  build:
    description: Turns build mode on or off.
    usage: /build <on|off>
  npc:
    description: Creates and manages the game NPCs of the lobby.
    usage: /npc <criar|mover|skin|nome|remover|listar>
permissions:
  muxe.lobby.build:
    description: Allows /build, which turns on creative mode to build and break in the lobby.
    default: op
  muxe.lobby.setspawn:
    description: Allows /setspawn.
    default: op
  muxe.lobby.fly:
    description: Arrives 5 blocks above the spawn with flight enabled.
    default: op
  muxe.lobby.npc:
    description: Allows /npc.
    default: op
