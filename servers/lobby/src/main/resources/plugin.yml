name: Muxe-Lobby
version: '${version}'
main: br.com.muxe.lobby.MuxeLobbyPlugin
author: Muxe
description: Main lobby of the Muxe network.
depend:
  - Muxe-Core
permissions:
  muxe.lobby.setspawn:
    description: Allows /setspawn.
    default: op
  muxe.lobby.fly:
    description: Arrives 5 blocks above the spawn with flight enabled and allows /fly.
    default: op
